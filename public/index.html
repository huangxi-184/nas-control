<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="format-detection" content="telephone=no" />
  <title>NAS 控制面板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>NAS 控制面板</h1>
      <p class="subtitle">屏幕开关 · 定时关机</p>
    </header>

    <section class="section">
      <h2 class="section-title">屏幕</h2>
      <div class="actions">
        <button id="btn-off" class="btn btn-off" type="button">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3v8" />
            <path d="M6.3 6.3a8 8 0 1 0 11.4 0" />
          </svg>
          关闭屏幕
        </button>
        <button id="btn-on" class="btn btn-on" type="button">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19" />
          </svg>
          打开屏幕
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">定时关机</h2>

      <label class="field">
        <span class="field-label">每天关机时间</span>
        <input id="schedule-time" type="time" value="03:00" step="60" />
      </label>

      <label class="toggle">
        <input id="schedule-enabled" type="checkbox" />
        <span>启用定时关机</span>
      </label>

      <button id="btn-save-schedule" class="btn btn-save" type="button">
        保存计划
      </button>

      <div id="schedule-info" class="schedule-info">未加载…</div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">
      就绪
    </div>

    <footer>
      <code id="tty">…</code>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
